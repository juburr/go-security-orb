name: Check FIPS 140-3 builds
description: >
  Checks that each Go binary you ship was built for FIPS 140-3 the way Go's
  native mode needs, from the build information every Go binary carries, and
  writes the evidence (each binary's SHA-256, Go release and FIPS settings) as
  JSON, JUnit and a run record. The step fails for a binary built with a Go
  release older than min_go_version, without GOFIPS140 or with a GOFIPS140
  that gofips140 doesn't name (latest is the unvalidated in-tree code), with
  FIPS 140-3 mode off by default (a go.mod godebug line can turn it off), with
  cgo when require_cgo_disabled is true, or linking a cryptography module
  outside the standard library that allowed_crypto_modules doesn't accept with
  a reason, unless report_only is true. It always fails for a file that isn't
  a Go binary with build information. A passing binary still runs out of FIPS
  140-3 mode if its environment sets GODEBUG=fips140=off. The GitHub Actions
  twin of the orb's fips_bin command.
author: juburr

inputs:
  allowed_crypto_modules:
    description: >
      Cryptography modules outside the standard library to accept, one per
      line: the module path and the reason, such as "golang.org/x/crypto only
      bcrypt, for passwords, outside the FIPS boundary by policy". A line
      without a reason fails the step. Accepted modules stay in the reports,
      marked as such.
    default: ""
  binaries:
    description: >
      The binaries to check: paths or glob patterns, such as bin/* or
      dist/*/server, separated by commas or spaces, relative to working_dir. A
      pattern that matches nothing fails the step.
    required: true
  fips140:
    description: >
      The FIPS 140-3 mode a binary must default to (its DefaultGODEBUG): on,
      or only, which also makes algorithms the mode doesn't allow fail. Go's
      documentation says only is meant for testing, not production.
    default: "on"
  gofips140:
    description: >
      The Go Cryptographic Module versions a binary may embed, as its build
      information records GOFIPS140, separated by commas or spaces. The
      default is v1.0.0, validated under CMVP certificate #5247, which Go 1.24
      records as v1.0.0 and Go 1.25 and later as v1.0.0-c2097c7c. Add v1.26.0
      to accept the version still in the CMVP's process. latest and off are
      refused: they mean no validated module.
    default: v1.0.0 v1.0.0-c2097c7c
  junit:
    description: >
      Also write JUnit XML, one test case per check and binary, for a JUnit
      reader such as a test report action.
    default: "true"
  min_go_version:
    description: >
      The oldest Go release a binary may be built with, such as 1.24 or
      1.25.2. Go 1.24 is the first with the native FIPS 140-3 mode.
    default: "1.24"
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-security-reports
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json,
      <report_name>.run-record.json and junit/<report_name>.xml. Give each run
      of this command in a job its own.
    default: fips-bin
  report_only:
    description: >
      Report problems without failing the step, to adopt the check gradually.
      A file that isn't a Go binary still fails it.
    default: "false"
  require_cgo_disabled:
    description: >
      Fail for a binary built with cgo (CGO_ENABLED=1): C code linked through
      cgo can carry cryptography of its own, outside the Go Cryptographic
      Module.
    default: "false"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): which binaries
      were checked, with their SHA-256, Go release and build settings, with
      which go, and what it found, as evidence for an assessment.
    default: "true"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-security-reports-<report_name> and a random suffix, including when
      the step fails.
    default: "true"
  working_dir:
    description: >
      Directory to run in: binaries are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-security-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Check FIPS 140-3 builds
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALLOWED_CRYPTO_MODULES: ${{ inputs.allowed_crypto_modules }}
        PARAM_BINARIES: ${{ inputs.binaries }}
        PARAM_FIPS140: ${{ inputs.fips140 }}
        PARAM_GOFIPS140: ${{ inputs.gofips140 }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MIN_GO_VERSION: ${{ inputs.min_go_version }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_REQUIRE_CGO_DISABLED: ${{ inputs.require_cgo_disabled }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/fips_bin.sh"
        "SCRIPT_GO_SECURITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_security.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
