name: Test in FIPS 140-3 mode
description: >
  Runs each module's tests linked with a Go Cryptographic Module (GOFIPS140)
  and in FIPS 140-3 only mode (GODEBUG=fips140=only), where algorithms the
  mode doesn't allow, such as MD5 for ETags or SHA-1 for legacy signatures,
  return an error or panic. That shows which code paths would break or fall
  outside the module before production finds them. Tests that fail count as
  findings, which report_only (true by default) only reports, so the check can
  be adopted first and enforced later; code that doesn't build, or a Go older
  than 1.24, always fails the step. A test that panics ends its package's test
  binary, so the package runs again without the tests that panicked, to find
  what the later ones use (unless extra_args sets -skip). It writes JSON, with
  the algorithms the mode refused, and JUnit. The GitHub Actions twin of the
  orb's fips_test command.
author: juburr

inputs:
  extra_args:
    description: >
      More go test arguments, such as -run, -timeout or -count, split like
      shell words. Nothing in them is expanded or run; environment variables
      are expanded before splitting. -json, -v and -tags are refused, since
      this command sets them.
    default: ""
  fips140:
    description: >
      The FIPS 140-3 mode to run the tests in: only, where algorithms the mode
      doesn't allow fail, or on, the mode as production runs it, where they
      still work (which shows that the code runs in the mode, with the
      module's self-tests).
    default: only
  gofips140:
    description: >
      The Go Cryptographic Module version to link the tests with, as GOFIPS140
      takes it: a version such as v1.0.0 or v1.26.0, or the certified or
      inprocess alias, which the Go release in use resolves. off and latest
      are refused, since they link no validated module.
    default: v1.0.0
  junit:
    description: >
      Also write JUnit XML, one test case per test, for a JUnit reader such as
      a test report action.
    default: "true"
  modules:
    description: >
      The modules to test: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-security-reports
  packages:
    description: >
      The package patterns to test in each module, separated by commas or
      spaces.
    default: ./...
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json,
      <report_name>.test.json (go test's own output),
      <report_name>.run-record.json and junit/<report_name>.xml. Give each run
      of this command in a job its own.
    default: fips-test
  report_only:
    description: >
      Report failing tests without failing the step. Set it to false to
      enforce the check once the tests pass. Code that doesn't build still
      fails the step.
    default: "true"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which go.mod and go.sum, with which Go, GOFIPS140 and GODEBUG, and what
      failed.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-security-reports-<report_name> and a random suffix, including when
      the step fails.
    default: "true"
  tags:
    description: >
      Build tags, separated by commas.
    default: ""
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-security-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Test in FIPS 140-3 mode
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FIPS140: ${{ inputs.fips140 }}
        PARAM_GOFIPS140: ${{ inputs.gofips140 }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
        PARAM_TAGS: ${{ inputs.tags }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/fips_test.sh"
        "SCRIPT_GO_SECURITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_security.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
