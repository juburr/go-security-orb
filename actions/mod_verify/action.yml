name: Verify Go modules
description: >
  Checks that each module builds with exactly the dependencies its go.mod and
  go.sum name, and that the job's Go settings don't weaken how go fetches
  them. The step fails on settings that turn off checksum verification
  (GOSUMDB=off, GONOSUMDB or GOPRIVATE matching public modules, GOINSECURE,
  GOFLAGS=-mod=mod), on a go.mod that needs a newer Go than the one on the
  PATH, on a go.sum that doesn't match what go downloads, on a module cache
  whose contents were changed (go mod verify), on go.mod or go.sum entries the
  build needs and they lack, and on a vendor directory that go mod vendor
  wouldn't write, unless report_only is true. It also sets up private modules
  (GOPRIVATE and credentials in ~/.netrc) and GOTOOLCHAIN=local for later
  steps, so run it first. The GitHub Actions twin of the orb's mod_verify
  command.
author: juburr

inputs:
  check_vendor:
    description: >
      In a module with a vendor directory (vendor/modules.txt), check that it
      holds exactly what go mod vendor writes. Needs Go 1.18 or newer.
    default: "true"
  junit:
    description: >
      Also write JUnit XML, one test case per check and module, for a JUnit
      reader such as a test report action.
    default: "true"
  modules:
    description: >
      The modules to check: directories that hold a go.mod, relative to
      working_dir, separated by commas or spaces; or all, for every module in
      working_dir and below it, skipping vendor and testdata directories and
      those whose names start with "." or "_", as go ./... patterns do.
    default: .
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/go-security-reports
  packages:
    description: >
      The package patterns whose dependencies, with their tests', must all be
      in go.mod and go.sum, separated by commas or spaces.
    default: ./...
  password:
    description: >
      The environment variable that holds the password or token for
      private_host.
    default: PRIVATE_MODULES_TOKEN
  pin_toolchain:
    description: >
      Run go with GOTOOLCHAIN=local here, and export it to later steps, so a
      go or toolchain line in go.mod can't make go download and run a
      different Go release. A go.mod that needs a newer Go than the one on the
      PATH then fails the step.
    default: "true"
  private_host:
    description: >
      The host to give the credentials in username and password to, such as
      github.com, written to ~/.netrc (or the file NETRC names) with mode 0600
      for this step and later ones. go, and git when go fetches from it, read
      them there. Empty writes no credentials.
    default: ""
  private_modules:
    description: >
      GOPRIVATE for this step and later ones: the module path patterns, such
      as github.com/my-org/*, that go fetches straight from their hosts,
      without the proxy or the checksum database, separated by commas. A
      pattern that matches public modules, such as github.com, fails the step.
      Empty leaves GOPRIVATE as the job sets it.
    default: ""
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json,
      <report_name>.run-record.json and junit/<report_name>.xml. Give each run
      of this command in a job its own.
    default: mod-verify
  report_only:
    description: >
      Report problems without failing the step, to adopt the check gradually.
      A check go can't complete, such as a download that fails for lack of
      network, still fails it.
    default: "false"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which go.mod, go.sum and vendor/modules.txt, with which Go and settings,
      and what it found.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      go-security-reports-<report_name> and a random suffix, including when
      the step fails.
    default: "true"
  tags:
    description: >
      Build tags, separated by commas, for packages that import some
      dependencies only with them.
    default: ""
  username:
    description: >
      The environment variable that holds the user name for private_host.
    default: PRIVATE_MODULES_USERNAME
  working_dir:
    description: >
      Directory to run in: modules are relative to it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=go-security-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: Verify Go modules
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_CHECK_VENDOR: ${{ inputs.check_vendor }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_MODULES: ${{ inputs.modules }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_PASSWORD: ${{ inputs.password }}
        PARAM_PIN_TOOLCHAIN: ${{ inputs.pin_toolchain }}
        PARAM_PRIVATE_HOST: ${{ inputs.private_host }}
        PARAM_PRIVATE_MODULES: ${{ inputs.private_modules }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
        PARAM_TAGS: ${{ inputs.tags }}
        PARAM_USERNAME: ${{ inputs.username }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/mod_verify.sh"
        "SCRIPT_GO_SECURITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/go_security.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
