name: Install go-security-orb tools
description: >
  Installs the Go security tools named in tools, each verified against this
  orb's checksum table, through the install command for that tool
  (install_govulncheck, install_gosec, ...), which can also be used on its
  own. gosec is a release binary, and Go a release archive, downloaded for
  amd64 or arm64, picked from the machine's CPU architecture. govulncheck and
  go-licenses publish no binaries, so they are built with a pinned Go release
  and checked against the table. Run this before the orb's other commands. The
  GitHub Actions twin of the orb's install command.
author: juburr

inputs:
  caching:
    description: >
      Cache each tool's verified download (or, for govulncheck and
      go-licenses, its verified build) between jobs. Only verified files are
      cached, and a cached file is verified again before it is used.
    default: "true"
  download_base_url:
    description: >
      Base URL of an internal mirror of GitHub releases, such as an
      Artifactory or Nexus remote repository, to download gosec from instead
      of https://github.com. It replaces https://github.com in the release
      URL, so the mirror must serve the same paths. It must be an https://
      URL, without credentials (user:password@) or a query or fragment, which
      would show in the log. What is downloaded is still verified against this
      orb's checksum table.
    default: ""
  go_download_base_url:
    description: >
      Base URL of an internal mirror of https://dl.google.com/go, to download
      Go release archives from: Go itself, and the Go release that builds
      govulncheck and go-licenses when the job's go is not that release. The
      same rules as download_base_url apply.
    default: ""
  go_install_path:
    description: >
      Absolute path of the directory to install Go into (its GOROOT), when
      tools names go. It must be missing, hold no files, or be a Go
      installation install_go installed before. Defaults to $HOME/sdk/go.
    default: ""
  go_licenses_version:
    description: >
      The go-licenses version, when tools names it.
    default: "2.0.1"
  go_version:
    description: >
      The Go version, when tools names go.
    default: "1.27.3"
  gosec_version:
    description: >
      The gosec version, when tools names it.
    default: "2.30.0"
  govulncheck_version:
    description: >
      The govulncheck version, when tools names it.
    default: "1.9.0"
  install_path:
    description: >
      Absolute path of the directory to install govulncheck, gosec and
      go-licenses into. It is created if needed and added to the PATH of later
      steps when it isn't already on it, and must be writable without root.
      Defaults to $HOME/bin.
    default: ""
  tools:
    description: >
      The tools to install, separated by commas or spaces: any of go,
      govulncheck, gosec and go-licenses. An unknown name fails the step. go
      installs first, so the rest find it on the PATH.
    default: govulncheck,gosec
  verify_checksums:
    description: >
      SHA-512 verification against this orb's checksum table, for every tool.
      "strict" (default) fails before downloading anything when a version has
      no checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning. "false" skips
      verification and is not recommended.
    default: strict

runs:
  using: composite
  steps:
    - name: Check the tools to install
      id: tools
      shell: bash
      env:
        PARAM_TOOLS: ${{ inputs.tools }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/install_tools.sh"
        # The names, space-separated with a space on either side, for the
        # if: conditions below.
        read -r -a tools <<< "${PARAM_TOOLS//,/ }"
        printf 'list= %s \n' "${tools[*]}" >> "${GITHUB_OUTPUT}"
    # The key is computed from a file that names the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and the
    # version, as the orb's command computes it.
    - name: Prepare Go cache key
      id: go-cache-key
      if: contains(steps.tools.outputs.list, ' go ') && (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/go-security-orb-go-cache-key
        PARAM_VERSION: ${{ inputs.go_version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        printf 'key=go-security-orb-go-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore Go cache
      id: go-restore
      if: contains(steps.tools.outputs.list, ' go ') && (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go
        key: ${{ steps.go-cache-key.outputs.key }}
    - name: Install Go
      if: contains(steps.tools.outputs.list, ' go ')
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.go_download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.go_install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.go_version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/go/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # install, not at the end of the job.
    - name: Save Go cache
      if: contains(steps.tools.outputs.list, ' go ') && (inputs.caching == 'true' || inputs.caching == '1') && steps.go-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go
        key: ${{ steps.go-cache-key.outputs.key }}
    # The key is computed from a file that names the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and the
    # version, as the orb's command computes it.
    - name: Prepare govulncheck cache key
      id: govulncheck-cache-key
      if: contains(steps.tools.outputs.list, ' govulncheck ') && (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/go-security-orb-govulncheck-cache-key
        PARAM_VERSION: ${{ inputs.govulncheck_version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        printf 'key=go-security-orb-govulncheck-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore govulncheck cache
      id: govulncheck-restore
      if: contains(steps.tools.outputs.list, ' govulncheck ') && (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-govulncheck
        key: ${{ steps.govulncheck-cache-key.outputs.key }}
    - name: Install govulncheck
      if: contains(steps.tools.outputs.list, ' govulncheck ')
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.go_download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.govulncheck_version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/govulncheck/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # install, not at the end of the job.
    - name: Save govulncheck cache
      if: contains(steps.tools.outputs.list, ' govulncheck ') && (inputs.caching == 'true' || inputs.caching == '1') && steps.govulncheck-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-govulncheck
        key: ${{ steps.govulncheck-cache-key.outputs.key }}
    # The key is computed from a file that names the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and the
    # version, as the orb's command computes it.
    - name: Prepare gosec cache key
      id: gosec-cache-key
      if: contains(steps.tools.outputs.list, ' gosec ') && (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/go-security-orb-gosec-cache-key
        PARAM_VERSION: ${{ inputs.gosec_version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        printf 'key=go-security-orb-gosec-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore gosec cache
      id: gosec-restore
      if: contains(steps.tools.outputs.list, ' gosec ') && (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-gosec
        key: ${{ steps.gosec-cache-key.outputs.key }}
    - name: Install gosec
      if: contains(steps.tools.outputs.list, ' gosec ')
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.gosec_version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/gosec/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # install, not at the end of the job.
    - name: Save gosec cache
      if: contains(steps.tools.outputs.list, ' gosec ') && (inputs.caching == 'true' || inputs.caching == '1') && steps.gosec-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-gosec
        key: ${{ steps.gosec-cache-key.outputs.key }}
    # The key is computed from a file that names the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and the
    # version, as the orb's command computes it.
    - name: Prepare go-licenses cache key
      id: go-licenses-cache-key
      if: contains(steps.tools.outputs.list, ' go-licenses ') && (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/go-security-orb-go-licenses-cache-key
        PARAM_VERSION: ${{ inputs.go_licenses_version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        printf 'key=go-security-orb-go-licenses-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore go-licenses cache
      id: go-licenses-restore
      if: contains(steps.tools.outputs.list, ' go-licenses ') && (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go-licenses
        key: ${{ steps.go-licenses-cache-key.outputs.key }}
    - name: Install go-licenses
      if: contains(steps.tools.outputs.list, ' go-licenses ')
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.go_download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.go_licenses_version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/go-licenses/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # install, not at the end of the job.
    - name: Save go-licenses cache
      if: contains(steps.tools.outputs.list, ' go-licenses ') && (inputs.caching == 'true' || inputs.caching == '1') && steps.go-licenses-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go-licenses
        key: ${{ steps.go-licenses-cache-key.outputs.key }}
