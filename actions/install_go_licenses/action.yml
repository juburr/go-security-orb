name: Install go-licenses
description: >
  Installs go-licenses, which finds the licenses of a Go module's
  dependencies, for Linux on amd64 or arm64. go-licenses publishes no
  binaries, so it is built from source with a pinned Go release (this job's go
  when it is that release, otherwise one downloaded and verified first), and
  the binary is checked against this orb's SHA-512 checksum table, since Go
  builds are reproducible. The licenses command needs it. The GitHub Actions
  twin of the orb's install_go_licenses command.
author: juburr

inputs:
  caching:
    description: >
      Cache the verified binary between jobs, keyed by version, CPU
      architecture and home directory, so later jobs install it without
      building it. Only verified binaries are cached, and a cached binary is
      verified again before it is installed.
    default: "true"
  download_base_url:
    description: >
      Base URL of an internal mirror of https://dl.google.com/go, such as an
      Artifactory or Nexus remote repository, to download the Go release that
      builds go-licenses from, when this job's go is not that release. It
      replaces https://dl.google.com/go in the download URL, so the mirror
      must serve the same file names. It must be an https:// URL, without
      credentials (user:password@) or a query or fragment, which would show in
      the log. What is downloaded is still verified against this orb's
      checksum table. The modules go-licenses is built from come through the
      job's GOPROXY.
    default: ""
  install_path:
    description: >
      Absolute path of the directory to install go-licenses into. It is
      created if needed and added to the PATH of later steps when it isn't
      already on it, and must be writable without root. Defaults to
      $HOME/.go-security-orb/bin. Executor images don't put that directory on
      the PATH, so it goes first, ahead of copies an image ships, such as the
      govulncheck in cimg/go's ~/go/bin.
    default: ""
  verify_checksums:
    description: >
      SHA-512 verification against this orb's checksum table. "strict"
      (default) fails before downloading anything when the version has no
      checksum in the table. "known_versions" verifies listed versions and
      installs unlisted versions unverified, with a warning. "false" skips
      verification and is not recommended.
    default: strict
  version:
    description: >
      Version of go-licenses to install, such as 2.0.1: a release of
      github.com/google/go-licenses/v2. A leading "v" is ignored.
    default: "2.0.1"

runs:
  using: composite
  steps:
    # The key is computed from a file that names the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and the
    # version, as the orb's command computes it.
    - name: Prepare go-licenses cache key
      id: cache-key
      if: (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/go-security-orb-go-licenses-cache-key
        PARAM_VERSION: ${{ inputs.version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        printf 'key=go-security-orb-go-licenses-v1-%s\n' "$(sha256sum < "${ORB_CACHE_KEY_FILE}" | cut -c1-64)" >> "${GITHUB_OUTPUT}"
    - name: Restore go-licenses cache
      id: restore
      if: (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go-licenses
        key: ${{ steps.cache-key.outputs.key }}
    - name: Install go-licenses
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/go-licenses/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # install, not at the end of the job.
    - name: Save go-licenses cache
      if: (inputs.caching == 'true' || inputs.caching == '1') && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-security-orb-go-licenses
        key: ${{ steps.cache-key.outputs.key }}
