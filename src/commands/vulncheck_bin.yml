description: >
  Runs govulncheck on the Go binaries you ship. Every Go binary records the
  Go release and module versions it was built with, so this needs no source
  and no build, and checks the standard library of the release that actually
  built each binary, which a source scan can't. It writes what it finds as
  JSON (<report_name>.json), SARIF and OpenVEX. The step fails on
  vulnerabilities at the scan level, unless report_only is true or ignore
  accepts them with a reason; it always fails for a file that isn't a Go
  binary with build information, when govulncheck can't complete, or when
  the database it read is stale or says nothing about its age.
parameters:
  binaries:
    type: string
    description: >
      The binaries to scan: paths or glob patterns, such as bin/* or
      dist/*/server, separated by commas or spaces, relative to working_dir.
      A pattern that matches nothing fails the step. Environment variables are
      expanded.
  working_dir:
    type: string
    default: "."
    description: >
      Directory to run in: binaries are relative to it.
  scan:
    type: enum
    enum: ["symbol", "package", "module"]
    default: symbol
    description: >
      What counts: symbol, vulnerabilities in functions linked into the
      binary (the others are reported without failing); package, also those
      in packages it contains; module, every vulnerability in a module it was
      built with. A binary stripped of its symbol table (-ldflags=-s) has
      every vulnerable function of its modules reported as called.
  db:
    type: string
    default: ""
    description: >
      The vulnerability database: an https:// mirror of vuln.go.dev, or a
      local copy as an absolute path or file:/// URL. Empty means the copy
      fetch_vuln_db exported in GO_SECURITY_VULN_DB, or else
      https://vuln.go.dev. Environment variables are expanded.
  max_db_age_days:
    type: integer
    default: 14
    description: >
      Fail when the database was last modified more than this many days ago,
      as a stale copy can be. 0 means no limit.
  ignore:
    type: string
    default: ""
    description: >
      Vulnerabilities to accept, one per line: a GO-, CVE- or GHSA- ID and
      the reason, such as "GO-2024-2687 the HTTP/2 server is never exposed".
      An entry without a reason fails the step. Accepted vulnerabilities stay
      in the reports, marked as such. Environment variables are expanded.
  formats:
    type: string
    default: "sarif,openvex"
    description: >
      Report formats besides JSON, separated by commas or spaces: sarif
      (<report_name>.sarif) and openvex (<report_name>.openvex.json). Empty
      writes JSON alone.
  extra_args:
    type: string
    default: ""
    description: >
      More govulncheck arguments, split like shell words. Nothing in them is
      expanded or run; environment variables are expanded before splitting.
      The options this command sets (-format, -json, -mode, -scan, -db, -show,
      -C, -test, -tags) are refused.
  output_dir:
    type: string
    default: /tmp/go-security-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  report_name:
    type: string
    default: govulncheck-bin
    description: >
      The reports' file name, without extension: <report_name>.json,
      <report_name>.raw.json (govulncheck's own output),
      <report_name>.sarif, <report_name>.openvex.json,
      <report_name>.run-record.json and junit/<report_name>.xml. Give each
      run of this command in a job its own.
  junit:
    type: boolean
    default: true
    description: >
      Also write JUnit XML, one failing test case per vulnerability that
      counts, and show it in CircleCI's Tests tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which binaries (with their SHA-256 and Go release), with which database
      and tools, and what it found.
  report_only:
    type: boolean
    default: false
    description: >
      Report vulnerabilities without failing the step, to adopt the check
      gradually. A govulncheck that can't complete, or a stale database,
      still fails it.
  store_artifacts:
    type: boolean
    default: true
    description: Store output_dir as job artifacts under go-security-reports/, including when the step fails.
steps:
  - run:
      name: govulncheck binaries
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_BINARIES: << parameters.binaries >>
        PARAM_DB: << parameters.db >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_FORMATS: << parameters.formats >>
        PARAM_IGNORE: << parameters.ignore >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_MAX_DB_AGE_DAYS: << parameters.max_db_age_days >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        PARAM_SCAN: << parameters.scan >>
        SCRIPT_GO_SECURITY_LIB: << include(scripts/lib/go_security.sh) >>
      command: << include(scripts/vulncheck_bin.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: go-security-reports
            when: always
