description: >
  Fetch private modules through a module proxy, such as Artifactory:
  configure_modules points GOPROXY at the proxy, writes the credentials from
  a context to ~/.netrc, where go finds them, and names your own modules in
  GONOSUMDB, which the public checksum database can't know, all for the steps
  after it. A pattern that matches public modules, or credentials in the proxy
  URL, fails the job. mod_verify then checks every dependency against go.mod
  and go.sum, and that no setting turns checksum verification off.

usage:
  version: 2.1
  orbs:
    go-security: juburr/go-security-orb@0.3.1
  jobs:
    security:
      docker:
        - image: cimg/go:1.27
      steps:
        - checkout
        - go-security/configure_modules:
            goproxy: https://artifactory.example.com/artifactory/api/go/go-virtual
            gonosumdb: github.com/my-org/*
            host: artifactory.example.com
            username: JF_USER
            password: JF_ACCESS_TOKEN
        - go-security/install
        - go-security/mod_verify
        - go-security/vulncheck
  workflows:
    security:
      jobs:
        - security:
            # Holds JF_USER and JF_ACCESS_TOKEN.
            context: artifactory
